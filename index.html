<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>GabayLink - Zamboanga Offline Navigator</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#002855" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      #map {
        height: 100%;
        width: 100%;
        z-index: 10;
      }
      @keyframes pulseGlow {
        0% {
          stroke-opacity: 0.9;
          stroke-width: 6px;
        }
        50% {
          stroke-opacity: 0.4;
          stroke-width: 9px;
        }
        100% {
          stroke-opacity: 0.9;
          stroke-width: 6px;
        }
      }
      .route-highlight-glow {
        animation: pulseGlow 2s infinite ease-in-out;
      }
    </style>
  </head>
  <body
    class="h-full flex flex-col bg-slate-900 text-slate-100 overflow-hidden"
  >
    <header
      class="bg-[#002855] border-b border-blue-900 px-4 py-3 flex items-center justify-between shrink-0 z-20 shadow-md"
    >
      <div class="flex items-center space-x-2.5">
        <div
          class="bg-[#FFC72C] text-[#002855] p-2 rounded-xl shadow font-bold flex items-center justify-center"
        >
          <i class="fa-solid fa-shield-halved text-base"></i>
        </div>
        <div>
          <h1
            class="text-sm sm:text-base font-bold tracking-tight text-white flex items-center gap-1.5"
          >
            <span>GabayLink</span>
            <span
              class="text-[10px] bg-emerald-500/20 text-emerald-400 font-medium px-1.5 py-0.5 rounded-full border border-emerald-500/30"
              >Offline</span
            >
          </h1>
          <p class="text-[11px] text-slate-300">San Roque Barangay Navigator</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button
          id="locate-btn"
          class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl text-xs font-medium transition flex items-center gap-1.5 border border-slate-700 cursor-pointer"
        >
          <i class="fa-solid fa-crosshairs text-[#FFC72C]"></i>
          <span class="hidden md:inline">My GPS</span>
        </button>
        <button
          id="reset-btn"
          class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 px-3 py-2 rounded-xl text-xs font-medium transition flex items-center gap-1.5 cursor-pointer"
        >
          <i class="fa-solid fa-rotate-right"></i>
          <span class="hidden md:inline">Reset</span>
        </button>
      </div>
    </header>

    <main class="flex-1 relative overflow-hidden flex flex-col">
      <div id="map"></div>

      <!-- METADATA & METRICS PANEL (Hidden by default) -->
      <div
        id="metadata-panel"
        class="absolute bottom-4 left-3 right-3 sm:left-6 sm:right-auto sm:max-w-sm z-30 transition-all duration-300 translate-y-[120%] opacity-0 pointer-events-none"
      >
        <div
          class="bg-slate-800/95 backdrop-blur-md border border-[#FFC72C]/40 p-4 rounded-2xl shadow-2xl pointer-events-auto relative"
        >
          <!-- Close / Hide Button -->
          <button
            id="close-panel-btn"
            class="absolute top-3 right-3 text-slate-400 hover:text-white text-xs w-6 h-6 rounded-full bg-slate-700/80 flex items-center justify-center cursor-pointer"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>

          <div
            class="flex items-start justify-between pb-3 border-b border-slate-700 pr-6"
          >
            <div>
              <span
                class="text-[10px] font-bold uppercase tracking-wider text-[#FFC72C] bg-amber-950/60 px-2 py-0.5 rounded border border-amber-800/50"
                >Evacuation Center</span
              >
              <h2 id="panel-title" class="text-sm font-bold text-white mt-1">
                Center Name
              </h2>
            </div>
          </div>

          <!-- LOADING SPINNER SECTION -->
          <div
            id="loading-section"
            class="py-4 flex items-center justify-center gap-3 bg-amber-500/10 border border-amber-500/30 rounded-xl my-3"
          >
            <i
              class="fa-solid fa-circle-notch fa-spin text-[#FFC72C] text-lg"
            ></i>
            <span class="text-xs font-semibold text-amber-300 tracking-wide"
              >Calculating optimal offline path...</span
            >
          </div>

          <!-- METRICS BODY (Hidden until loaded) -->
          <div id="metrics-body" class="mt-3 hidden">
            <div
              class="bg-slate-900/80 p-3 rounded-xl border border-slate-700/60 flex items-center justify-between"
            >
              <div>
                <span class="text-[11px] text-slate-400 block font-medium"
                  >Distance from GPS</span
                >
                <span
                  id="metric-distance"
                  class="text-xl font-bold text-white tracking-tight mt-0.5 block"
                  >0.00 km</span
                >
              </div>
              <div class="text-right">
                <span class="text-[11px] text-slate-400 block font-medium"
                  >Status</span
                >
                <span
                  id="metric-status-chip"
                  class="text-xs bg-emerald-500/20 text-emerald-400 font-semibold px-2 py-0.5 rounded-full border border-emerald-500/30"
                  >Active</span
                >
              </div>
            </div>

            <div
              class="mt-2.5 pt-2 text-[11px] text-slate-400 flex items-center justify-between border-t border-slate-700/40"
            >
              <span id="coord-info" class="truncate">Coordinates: --</span>
              <span class="text-[#FFC72C] font-medium"
                >Offline Direct Routing</span
              >
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT EDGE HANDLE TO REOPEN PANEL WHEN HIDDEN -->
      <button
        id="open-panel-handle"
        class="absolute right-0 top-1/2 -translate-y-1/2 z-30 bg-[#002855] text-[#FFC72C] border-y border-l border-[#FFC72C]/40 py-3 px-2 rounded-l-xl shadow-lg flex flex-col items-center gap-1.5 text-xs font-medium cursor-pointer transition-all translate-x-full opacity-0 pointer-events-none hover:bg-blue-950"
        title="Open Destination Info"
      >
        <i class="fa-solid fa-chevron-left text-xs animate-pulse"></i>
        <span
          style="writing-mode: vertical-rl"
          class="tracking-widest uppercase text-[10px]"
          >Info</span
        >
      </button>

      <div
        id="toast"
        class="absolute top-3 left-1/2 -translate-x-1/2 z-40 bg-slate-800 text-slate-200 px-3.5 py-2 rounded-xl border border-slate-700 shadow-xl text-xs font-medium flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none translate-y-[-10px]"
      >
        <i class="fa-solid fa-circle-info text-[#FFC72C]"></i>
        <span id="toast-msg">Notification</span>
      </div>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
